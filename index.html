<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rong Tang - Personal Homepage</title>
  <style>
    :root {
      /* Colors defined in instructions */
      --link: #1a4b8c;     /* deep-blue links */
      --accent: #b34a2e;   /* warm-rust accents */
      --bg: #ffffff;
      --text: #222222;
      --text-muted: #555555;
      --border: #eaeaea;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--bg);
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header & Typography */
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 700; letter-spacing: -0.5px; }
    h1 .dot { color: var(--accent); }
    h2 { font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-top: 3rem; margin-bottom: 1.5rem; font-weight: 600;}
    
    a { color: var(--link); text-decoration: none; transition: color 0.2s ease; }
    a:hover { text-decoration: underline; color: var(--accent); }

    /* Contact & Profile Links */
    .contact-list, .profile-links {
      list-style: none;
      padding: 0;
      margin: 0 0 0.5rem 0;
      color: var(--text-muted);
    }
    .contact-list li, .profile-links li { display: inline-block; margin-right: 1.5rem; margin-bottom: 0.5rem; }
    .profile-links { margin-bottom: 2rem; }

    /* Lists & Publications */
    .pubs { padding-left: 1.5rem; margin-bottom: 2rem; }
    .pubs li { margin-bottom: 1rem; }
    .me { font-weight: bold; color: #000; } /* Bolds your name as requested */
    .journal { font-style: italic; color: var(--text-muted); }

    /* Timeline for Education/Talks */
    .timeline { list-style: none; padding: 0; }
    .timeline li { display: flex; margin-bottom: 1rem; }
    .timeline .year { min-width: 120px; font-weight: 600; color: var(--text-muted); }
    .timeline .details { flex-grow: 1; }

    /* Map Host Placeholder */
    #map-host { margin-top: 2rem; display: flex; justify-content: center; }
    .placeholder {
      background-color: #f9f9f9;
      border: 1px dashed #ccc;
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }
    .placeholder code { background: #eee; padding: 2px 6px; border-radius: 4px; color: var(--accent); }

    @media (max-width: 600px) {
      .timeline li { flex-direction: column; }
